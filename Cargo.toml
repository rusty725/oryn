[package]
name = "oryn"
version = "0.1.7"
edition = "2024"
license = "MIT"
description = "Terminal hardware monitor: every temperature sensor plus btop-style CPU, GPU, memory, disk, network and process panels"

[dependencies]
sysinfo = "0.39.6"
crossterm = "0.29.0"
ratatui = "0.30.2"
serde_json = "1.0.154"
libloading = "0.9.0"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }


[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = true
strip = true
